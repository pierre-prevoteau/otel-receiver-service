resourceMetrics:
  - resource: {}
    scopeMetrics:
      - metrics:
          - description: Current state of the service, as a platform independent integer code.
            gauge:
              dataPoints:
                - asInt: "1"
                  attributes:
                    - key: system.service.name
                      value:
                        stringValue: cron
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: system.service.name
                      value:
                        stringValue: mystery
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "4"
                  attributes:
                    - key: system.service.name
                      value:
                        stringValue: nginx
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "3"
                  attributes:
                    - key: system.service.name
                      value:
                        stringValue: postgresql
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "5"
                  attributes:
                    - key: system.service.name
                      value:
                        stringValue: spooler
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "2"
                  attributes:
                    - key: system.service.name
                      value:
                        stringValue: sshd
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "6"
                  attributes:
                    - key: system.service.name
                      value:
                        stringValue: systemd-timesyncd
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: system.service.state
            unit: '{state}'
        scope:
          name: github.com/pierre-prevoteau/otel-receiver-service/servicereceiver
          version: latest
