# OpenTelemetry Collector Builder (OCB) manifest.
#
# Build with:
#   go install go.opentelemetry.io/collector/cmd/builder@v0.158.0
#   builder --config examples/builder-config.yaml
#
# The resulting binary is written to ./otelcol-service/ (see dist.output_path).
dist:
  name: otelcol-service
  description: OpenTelemetry Collector distribution with the unified system service receiver
  output_path: ./otelcol-service
  otelcol_version: 0.158.0

receivers:
  # The system service receiver from this repository. The package lives in the
  # servicereceiver/ subdirectory, so both gomod (module) and import (package)
  # are specified.
  - gomod: github.com/pierre-prevoteau/otel-receiver-service v0.1.0
    import: github.com/pierre-prevoteau/otel-receiver-service/servicereceiver
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.158.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.158.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.158.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.158.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.64.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.64.0

# Local development only: compile the receiver from this working tree instead of
# fetching a published tag. The path is relative to the generated collector's
# go.mod (the dist.output_path directory). Remove this block once you publish a
# tagged release (e.g. v0.1.0) and want to consume it from GitHub.
replaces:
  - github.com/pierre-prevoteau/otel-receiver-service => ../
